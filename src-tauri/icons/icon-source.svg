<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ZeppBridge</title>
  <desc id="desc">Two parallel angular rails fold into a sharp Z on a dark rounded square.</desc>

  <!-- Single 24x24 master geometry; UI and platform assets derive from it. The
       two open rails keep the mark legible at 16/20/24px without extra dots. -->
  <defs>
    <symbol id="brand-mark" viewBox="0 0 24 24" data-shape="angular-double-rail-z">
      <path
        d="M3.8 5H16.2L4 19"
        fill="none"
        stroke="currentColor"
        stroke-width="3.1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M20.2 5L8 19H20.2"
        fill="none"
        stroke="currentColor"
        stroke-width="3.1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="#0F1512" />
  <!-- 800px symbol box leaves the required optical quiet margin. -->
  <use href="#brand-mark" x="112" y="112" width="800" height="800" color="#CDDC7C" />
</svg>
