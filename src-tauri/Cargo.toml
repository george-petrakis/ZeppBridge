[workspace]
members = ["crates/core", "crates/cli", "crates/mcp"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
directories = "5.0"
tracing = "0.1"
base64 = "0.22"
regex = "1.10"
url = "2.5"
# 原始报文压缩。已经在依赖树里（reqwest 的 gzip 走的是它），这里只是把它
# 变成直接依赖，好在 storage 里显式使用。
flate2 = "1"
zeppbridge-core = { path = "crates/core" }

[package]
name = "zeppbridge"
version = "1.1.5"
description = "本地优先的 Zepp 健康数据桥"
authors = ["ZeppBridge"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeppbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zeppbridge-core = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }

# 登录窗口的标签是固定的，所以「关掉旧窗口」和「用同一个标签建新窗口」之间
# 的时序是一条真实的失败路径。`tauri` 的 mock runtime 让这条路径可以在没有
# 窗口系统的地方跑出来。
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
