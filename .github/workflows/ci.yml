name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test feedback receiver
        run: npm run test:feedback

      - name: Verify icon consistency
        run: |
          python -m pip install --upgrade pillow
          npm run icons:verify

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked --jobs 1

  verify-macos:
    name: macOS verification
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build resolves frontendDist (../dist) at compile time, so the
      # frontend must exist before any cargo command runs.
      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked --jobs 1

  package:
    name: Package Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    # Package on pushes to main / release tags and manual dispatch, not on PRs.
    if: github.event_name != 'pull_request'
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle (NSIS + MSI)
        # beforeBuildCommand (icons:generate + vite build) runs as part of this.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # latest.json 的 notes 就是应用内更新弹窗展示给用户的说明，硬编码会
      # 让每次发版都显示上一版的内容。发布 tag 时取该 tag 的注释首行。
      - name: Resolve release notes from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          # 浅克隆只取到 tag 指向的 commit，附注对象不在本地；不显式拉取的话
          # `%(contents:subject)` 会静默回退成 commit 标题，把「fix(site): ...」
          # 这种工程日志当成更新说明推给用户。
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::warning::${GITHUB_REF_NAME} 是轻量标签，没有注释消息；沿用默认说明"
            exit 0
          fi
          notes=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)')
          if [[ -z "$notes" ]]; then
            echo "::warning::标签注释为空，沿用默认说明"
            exit 0
          fi
          echo "ZEPPBRIDGE_RELEASE_NOTES=${notes}" >> "$GITHUB_ENV"
          echo "更新说明：${notes}"

      - name: Collect installers into release/
        shell: pwsh
        run: ./scripts/windows/publish-local.ps1 -SkipShortcuts -SkipStaleInstall

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zeppbridge-installers
          path: |
            release/ZeppBridge_*-setup.exe
            release/ZeppBridge_*.msi
            release/latest.json
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS bundle
    runs-on: macos-latest
    timeout-minutes: 45
    # Package on pushes to main / release tags and manual dispatch, not on PRs.
    if: github.event_name != 'pull_request'
    needs: verify-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle (app + dmg)
        # beforeBuildCommand (icons:generate + vite build) runs as part of this.
        # The bundle is ad-hoc signed: no Apple Developer ID, no notarization.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app,dmg

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bundle=src-tauri/target/release/bundle
          mkdir -p release-macos

          dmg=$(ls "$bundle"/dmg/*.dmg)
          cp "$dmg" "release-macos/ZeppBridge_${version}_aarch64.dmg"

          # The updater consumes the .app.tar.gz, never the dmg. A missing
          # signature would advertise an unverifiable update, so fail here
          # rather than publish a half-signed latest.json.
          cp "$bundle/macos/ZeppBridge.app.tar.gz" \
             "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/ZeppBridge.app.tar.gz.sig" \
             "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz.sig"
          ls -la release-macos

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: zeppbridge-macos
          path: release-macos/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only on release tags (v*), and only once both platforms packaged.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, package-macos]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag annotation is the release body, and a depth-1 checkout does
          # not bring the tag object with it.
          fetch-depth: 0

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: zeppbridge-installers
          path: release

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: zeppbridge-macos
          path: release-macos

      - name: Merge updater metadata for both platforms
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release/merge-latest-json.mjs \
            --windows-latest release/latest.json \
            --mac-signature "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz.sig" \
            --mac-asset "ZeppBridge_${version}_aarch64.app.tar.gz" \
            --version "$version" \
            --repo "${GITHUB_REPOSITORY}" \
            --out release/latest.json
          cat release/latest.json

      # 发版说明取附注标签的正文。`--generate-notes` 给的是 commit 列表，
      # 那是工程日志不是更新说明——读者要知道这版能多做什么，不是有哪些
      # commit。轻量标签没有正文，那时才回退到自动生成。
      - name: Resolve release body from tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::warning::${GITHUB_REF_NAME} 是轻量标签，发版说明回退为自动生成"
            echo "RELEASE_BODY_MODE=generate" >> "$GITHUB_ENV"
            exit 0
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' \
            > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::标签正文为空，发版说明回退为自动生成"
            echo "RELEASE_BODY_MODE=generate" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "RELEASE_BODY_MODE=file" >> "$GITHUB_ENV"
          cat release-notes.md

      - name: Publish GitHub Release
        # Idempotent: skips if the release already exists.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, skipping publish"
            exit 0
          fi
          if [[ "${RELEASE_BODY_MODE}" == "file" ]]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release/ZeppBridge_*-setup.exe \
            release/ZeppBridge_*.msi \
            "release-macos/ZeppBridge_${version}_aarch64.dmg" \
            "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz" \
            release/latest.json \
            --title "ZeppBridge ${version}" \
            "${notes_args[@]}"
