name: 装不上 / 打不开
description: 安装失败、双击没反应、启动闪退、登录不上、更新失败
title: "[安装] "
labels: ["install"]
body:
  - type: markdown
    attributes:
      value: |
        ### 先看一眼这条

        **不要在这里粘贴任何令牌、cookie、账号、密码、设备序列号，也不要贴含有你用户名的完整本机路径。**
        Issue 是公开的。需要路径时写成 `C:\Users\<用户名>\...` 这样即可。
  - type: input
    id: version
    attributes:
      label: 你下载的 ZeppBridge 版本
      description: 安装包文件名里的版本号。
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 你用的是哪个安装包
      options:
        - Windows setup.exe（NSIS）
        - Windows .msi
        - macOS .dmg
        - 应用内自动更新
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel，当前不支持)
        - 其他
    validations:
      required: true
  - type: input
    id: os_build
    attributes:
      label: 系统版本号
      description: Windows「设置 →系统 →系统信息」里的版本，或 macOS「关于本机」。
      placeholder: "Windows 11 23H2 / macOS 15.3"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 卡在哪一步
      options:
        - 安装包无法运行 / 被系统拦截
        - 安装完成但双击没反应
        - 启动后立刻闪退
        - 能打开但连接 Zepp 账号失败
        - 自动更新失败
        - 其他
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: 实际发生了什么
      description: 有报错弹窗就描述文字内容；有截图可以贴，但请先确认截图里没有账号或令牌。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 下载 ZeppBridge_1.0.0_x64-setup.exe
        2. 双击安装，一路默认
        3. 从开始菜单点击 ZeppBridge，窗口一闪就消失
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这条 issue 和其中的截图里没有令牌、cookie、账号、密码、序列号或含真实用户名的完整路径。
          required: true
