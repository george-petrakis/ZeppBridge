name: 数据不对
description: 某项数据和 Zepp App 对不上、显示为空、单位或时间不对
title: "[数据] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        ### 先看一眼这条

        **不要在这里粘贴任何令牌、cookie、账号、设备序列号、精确 GPS 坐标，或完整的接口返回内容。**
        Issue 是公开的，一旦贴出去就无法真正撤回。

        需要发原始报文时，请改用应用内的「设置 →隐私与安全 →提交错误报告」：
        它只发送脱敏的字段结构、固件版本和未知编号，不发送以上任何内容。

        描述数值时，用「和 App 差了约 12%」「少了 3 天」这类相对描述就够了，
        不必贴出你的真实心率、体重或睡眠时长。
  - type: input
    id: version
    attributes:
      label: ZeppBridge 版本
      description: 设置页底部，或安装包文件名里的版本号。
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - 其他
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手表 / 手环型号
      description: 产品名即可，例如「Amazfit T-Rex 3」。**不要填序列号或设备 ID。**
      placeholder: "Amazfit ..."
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 固件版本
      description: Zepp App →设备 →关于手表。填不到就写「未知」。
      placeholder: "1.2.34.5"
    validations:
      required: true
  - type: dropdown
    id: stream
    attributes:
      label: 哪一类数据不对
      options:
        - 睡眠
        - 心率 / 静息心率
        - HRV
        - 压力
        - 血氧
        - 运动记录（摘要）
        - 运动详情 / 曲线 / 轨迹
        - 训练负荷 / 训练状态
        - 步数 / 卡路里等日度指标
        - 其他
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Zepp App 里显示的是什么，ZeppBridge 里显示的是什么
      description: 用相对差异描述即可，不必贴真实数值。
      placeholder: |
        App：8 月 20 日有一次夜间睡眠。
        ZeppBridge：同一天的睡眠页面是空的。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ZeppBridge，完成一次同步
        2. 进入「睡眠」页面
        3. 选择 8 月 20 日
    validations:
      required: true
  - type: input
    id: report_id
    attributes:
      label: 应用内错误报告编号（可选）
      description: 如果你已经在设置页点过「提交错误报告」，把返回的编号填在这里，方便对上号。
      placeholder: "例如 a1b2c3d4"
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这条 issue 里没有令牌、cookie、账号、序列号、设备 ID、精确 GPS 坐标或完整接口返回内容。
          required: true
